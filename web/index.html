<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>健身養寵</title>

    <meta name="description" content="健身養寵：記錄飲食與訓練，陪寵物一起成長" />
    <meta name="theme-color" content="#fffaf0" />
    <link rel="manifest" href="/manifest.webmanifest?v=fitness-puppy-v1" />
    <link rel="icon" href="/favicon-32.png?v=fitness-puppy-v1" sizes="32x32" type="image/png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=fitness-puppy-v1" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="健身養寵" />
    <script>
      // beforeinstallprompt 可能在 JS bundle 載入前就觸發（例如 service worker 已註冊過的回訪），
      // 那時 Vue 還沒掛載、監聽器來不及掛上，安裝按鈕就永遠不會出現。
      // 所以在這裡先接住並存起來，App 再去讀。
      window.__installPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        e.preventDefault();
        window.__installPrompt = e;
        window.dispatchEvent(new Event('installprompt-ready'));
      });
      window.addEventListener('appinstalled', () => {
        window.__installPrompt = null;
        window.dispatchEvent(new Event('installprompt-ready'));
      });
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
