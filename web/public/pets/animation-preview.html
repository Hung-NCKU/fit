<!doctype html>
<html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>寵物動畫預覽</title>
<style>
body{margin:0;background:#f5f0e8;color:#42382f;font:16px system-ui,sans-serif}main{max-width:1040px;margin:auto;padding:32px 20px}h1{font-size:26px;margin:0 0 8px}p{color:#776b60;line-height:1.7}button{border:1px solid #dacbbb;background:white;border-radius:20px;padding:9px 17px;font:inherit;cursor:pointer;margin:4px}button.on{background:#654c3a;color:white}section{display:grid;grid-template-columns:repeat(auto-fit,minmax(165px,1fr));gap:12px;margin:28px 0}.card{border:1px solid #e2d7c9;border-radius:20px;background:#fffdf8;padding:14px;text-align:center;overflow:hidden}.stage{height:185px;display:grid;place-items:end center;background:linear-gradient(#f4e6d2 0 78%,#d6b596 78%);border-radius:12px;margin-top:12px}.sprite{width:148px;height:148px;position:relative;--duration:1.4s}.sprite svg{position:absolute;inset:0;width:100%;height:100%;overflow:hidden;opacity:0;animation:frames var(--duration) step-end infinite}.idle{--duration:6.8s}.walk{--duration:.8s}.eat{--duration:2.2s}.sleep{--duration:6s}.play{--duration:2.6s}@keyframes frames{0%{opacity:1}25%,100%{opacity:0}}.idle svg{animation-delay:0s!important}.idle svg:nth-child(1){animation-name:open}.idle svg:nth-child(2){animation-name:half}.idle svg:nth-child(3){animation-name:closed}.idle svg:nth-child(4){animation-name:reopen}@keyframes open{0%,94%,100%{opacity:1}88%{opacity:0}}@keyframes half{0%,90%,100%{opacity:0}88%{opacity:1}}@keyframes closed{0%,93%,100%{opacity:0}90%{opacity:1}}@keyframes reopen{0%,94%,100%{opacity:0}93%{opacity:1}}.paused .sprite svg{animation-play-state:paused}@media(prefers-reduced-motion:reduce){.sprite svg{animation:none;opacity:0}.sprite svg:first-child{opacity:1}}
</style><main><h1>讓牠動得更自然</h1><p>保留原本的角色造型，用四幀連續動作取代整張圖片搖晃。待機偶爾眨眼，吃飯與睡覺使用較慢的節奏。</p><div><button class="on" data-pet="cat">橘白貓</button><button data-pet="chinchilla">龍貓</button><button id="pause">暫停播放</button></div><section><div class="card">待機・眨眼<div class="stage"><div class="sprite idle"></div></div></div><div class="card">行走<div class="stage"><div class="sprite walk"></div></div></div><div class="card">進食<div class="stage"><div class="sprite eat"></div></div></div><div class="card">睡覺<div class="stage"><div class="sprite sleep"></div></div></div><div class="card">玩耍<div class="stage"><div class="sprite play"></div></div></div></section><p>原素材保留。App 另加入動作淡入淡出、較輕微的呼吸，以及走到端點後停頓轉向；支援「減少動態效果」設定。</p></main><script>
const layouts={"cat": {"width": 1122, "height": 1402, "poses": {"idle": ["36.5 34.0 242 242", "317.0 34.0 242 242", "583.0 34.0 242 242", "866.0 34.0 242 242"], "walk": ["34.5 287.0 242 242", "312.5 287.0 242 242", "576.0 287.0 242 242", "852.5 287.0 242 242"], "eat": ["41.5 567.0 242 242", "324.0 567.0 242 242", "591.5 567.0 242 242", "864.5 567.0 242 242"], "sleep": ["37.0 820.0 242 242", "312.5 820.0 242 242", "579.0 820.0 242 242", "850.5 820.0 242 242"], "play": ["44.5 1096.0 242 242", "319.0 1096.0 242 242", "594.5 1096.0 242 242", "858.5 1096.0 242 242"]}}, "chinchilla": {"width": 1122, "height": 1402, "poses": {"idle": ["39.5 44.6 255 255", "305.5 44.6 255 255", "583.0 44.6 255 255", "849.0 44.6 255 255"], "walk": ["31.0 282.6 255 255", "300.5 282.6 255 255", "577.0 282.6 255 255", "850.0 282.6 255 255"], "eat": ["42.0 557.6 255 255", "312.5 557.6 255 255", "587.0 557.6 255 255", "855.0 557.6 255 255"], "sleep": ["33.0 807.6 255 255", "302.5 807.6 255 255", "581.5 807.6 255 255", "849.5 807.6 255 255"], "play": ["35.5 1097.6 255 255", "308.5 1097.6 255 255", "591.0 1097.6 255 255", "856.0 1097.6 255 255"]}}};
function showPet(species){document.querySelectorAll('.sprite').forEach(el=>{const pose=el.classList[1];const layout=layouts[species];el.innerHTML=layout.poses[pose].map((box,i)=>`<svg viewBox="${box}" style="animation-delay:calc(var(--duration) * ${i?(i-4)/4:0})"><image href="animated-${species}-v2.webp" width="${layout.width}" height="${layout.height}"/></svg>`).join('')})}
document.querySelectorAll('[data-pet]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-pet]').forEach(x=>x.classList.toggle('on',x===b));showPet(b.dataset.pet)});document.querySelector('#pause').onclick=e=>{document.body.classList.toggle('paused');e.target.textContent=document.body.classList.contains('paused')?'繼續播放':'暫停播放'};showPet('cat');
</script></html>
