; 網頁匯出設定。兩個關鍵選項：
;
;   variant/thread_support=false
;     開執行緒的話瀏覽器會要求 COOP/COEP 兩個 header（跨來源隔離），
;     整頁都得跟著改，連載圖都會受影響。這個遊戲只有一隻動物在走，
;     單執行緒綽綽有餘，關掉就不必動伺服器的 header。
;
;   html/canvas_resize_policy=2
;     Adaptive：畫布跟著 CSS 的大小走。寵物頁的卡片寬度是響應式的，
;     固定解析度會在手機上破版。

